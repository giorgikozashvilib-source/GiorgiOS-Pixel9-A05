
name: GiorgiOS Project Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "GiorgiOS Pixel 9 Edition"
          test -f README.md
          echo "Project files found."
